[project]
name = "spike-agent365-litellm-tools-gateway"
version = "0.1.0"
description = "When a LiteLLM gateway is connected to the Agent 365 tools gateway, what is actually governed: which calls a block stops and how fast, at what granularity, how new or changed MCP servers are noticed, with which identity, which controls we have in Agent 365, and with which audit records?"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "openai>=3.42.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
# First-party code: the experiment scripts and the services (each deployed with its own requirements.txt).
src = ["src", "services/notes-mcp"]
